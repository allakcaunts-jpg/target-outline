name: Build TARGET OUTLINE APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: target-outline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify source archive
        shell: bash
        run: |
          set -euo pipefail
          test -s TARGET_OUTLINE_SOURCE_1.2.zip
          unzip -t TARGET_OUTLINE_SOURCE_1.2.zip

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "platform-tools"

      - name: Extract and validate project
        shell: bash
        run: |
          set -euo pipefail
          PROJECT_DIR="$RUNNER_TEMP/target-outline-source"
          mkdir -p "$PROJECT_DIR"
          unzip -q TARGET_OUTLINE_SOURCE_1.2.zip -d "$PROJECT_DIR"
          test -s "$PROJECT_DIR/settings.gradle"
          test -s "$PROJECT_DIR/build.gradle"
          test -s "$PROJECT_DIR/app/build.gradle"
          test -s "$PROJECT_DIR/app/src/main/AndroidManifest.xml"
          test -s "$PROJECT_DIR/app/src/main/python/detector.py"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project structure validated."

      - name: Run Python detector tests
        working-directory: ${{ runner.temp }}/target-outline-source
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile app/src/main/python/detector.py
          python -m unittest discover -s tools -p 'test_*.py' -v

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Print build tool versions
        shell: bash
        run: |
          java -version
          python --version
          gradle --version

      - name: Build debug APK
        working-directory: ${{ runner.temp }}/target-outline-source
        shell: bash
        run: gradle --no-daemon --stacktrace --warning-mode all clean assembleDebug

      - name: Verify APK output
        shell: bash
        run: |
          set -euo pipefail
          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          echo "APK built successfully:"
          ls -lh "$APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: TARGET-OUTLINE-debug-apk
          path: ${{ runner.temp }}/target-outline-source/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
