name: Build TARGET OUTLINE APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check source archive
        shell: bash
        run: |
          set -euo pipefail
          test -f TARGET_OUTLINE_SOURCE_1.1.zip
          echo "Source ZIP found."

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Extract project archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p extracted
          unzip -q TARGET_OUTLINE_SOURCE_1.1.zip -d extracted
          PROJECT_DIR="$(find extracted -type f -name settings.gradle -printf '%h\n' | head -n 1)"
          if [ -z "$PROJECT_DIR" ]; then
            echo "::error::Could not find settings.gradle inside the source ZIP."
            find extracted -maxdepth 4 -type f | head -n 80
            exit 1
          fi
          echo "PROJECT_DIR=$GITHUB_WORKSPACE/$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project root: $PROJECT_DIR"
          test -f "$PROJECT_DIR/app/build.gradle"
          test -f "$PROJECT_DIR/app/src/main/AndroidManifest.xml"

      - name: Check Python detector syntax
        shell: bash
        run: |
          set -euo pipefail
          DETECTOR="$(find "$PROJECT_DIR" -type f -path '*/src/main/python/detector.py' | head -n 1)"
          test -n "$DETECTOR"
          python -m py_compile "$DETECTOR"
          echo "Python detector syntax is valid."

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Verify APK exists
        shell: bash
        run: |
          set -euo pipefail
          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          ls -lh "$APK"

      - name: Upload APK to workflow Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TARGET-OUTLINE-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
          
